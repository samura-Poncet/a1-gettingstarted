<!doctype html>
<html lang="en">

        <meta charset="utf-8">
          <style>
            body{

            .about {

            }
            .delay-1{
                animation-delay: 1s;
            }
            .delay-2{
                animation-delay: 2s;
            }
            .delay-3{
                animation-delay: 3s;
            }
            .delay-4{
                animation-delay: 4s;
            }
            .delay-5{
                animation-delay: 5s;
            }
            @keyframes fadeIN{
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
    
            </style>
